# Server Configuration
server.port=${PORT:8080}
spring.application.name=techapp-backend

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-1a0c1826-awoluawol-2e7c.i.aivencloud.com:17276/defaultdb?ssl-mode=REQUIRED&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your-password-here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool - reconnect automatically if Aiven sleeps
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Reduce memory usage
spring.jpa.open-in-view=false
spring.devtools.add-properties=false
spring.main.lazy-initialization=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:blf6qaue}
cloudinary.api-key=${CLOUDINARY_API_KEY:243737822492155}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:rVjrQqzOWL1-9MOS0VylBVFpwUc}

# Upload directory
upload.dir=C:/uploads
server.url=https://etech-backend-fmst.onrender.com

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
