plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.awol.etechpro'
    compileSdk 36

    defaultConfig {
        applicationId "com.awol.etechpro"
        minSdk 24
        targetSdk 36
        versionCode 26
        versionName "1.2.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    configurations.all {
        resolutionStrategy {
            // Force browser 1.8.0 — LevelPlay pulls 1.9.0 which requires AGP 8.9.1+
            force 'androidx.browser:browser:1.8.0'
        }
    }
}

dependencies {
    // Firebase BOM
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Lifecycle (for App Open Ad)
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:23.2.0'

    // Unity Ads
    implementation 'com.unity3d.ads:unity-ads:4.21.0'

    // Start.io (formerly StartApp)
    implementation 'com.startapp:inapp-sdk:5.3.1'

    // Meta Audience Network — included via LevelPlay facebook-adapter:5.6.0 (no separate SDK needed)

    // InMobi SDK
    implementation 'com.inmobi.monetization:inmobi-ads-kotlin:11.5.1'
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'androidx.browser:browser:1.8.0'

    // LevelPlay (ironSource) SDK — for Meta mediation only
    implementation 'com.unity3d.ads-mediation:mediation-sdk:9.5.0'
    // Meta adapter — includes Meta Audience Network SDK (replaces direct com.facebook.android:audience-network-sdk)
    implementation 'com.unity3d.ads-mediation:facebook-adapter:5.6.0'
    // Force browser version compatible with AGP 8.7.0
    implementation 'androidx.browser:browser:1.8.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
