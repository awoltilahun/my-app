# Server Configuration
server.port=${PORT:8080}
spring.application.name=techapp-backend

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/myappdb?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myappuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Awolu@0835}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool - reduce memory usage
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Reduce memory usage
spring.jpa.open-in-view=false
spring.devtools.add-properties=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
upload.dir=C:/uploads
server.url=https://my-app-production-fb6d.up.railway.app

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
